name: Sync Static Noise

on:
  repository_dispatch:
    types: [static-noise-release]
  workflow_dispatch:
    inputs:
      sha:
        description: Full Static Noise commit SHA
        required: true
        type: string
      version:
        description: Static Noise version without v
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    concurrency:
      group: static-noise-sync
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Synchronize generated palette
        env:
          STATIC_NOISE_SHA: ${{ github.event.client_payload.sha || inputs.sha }}
          STATIC_NOISE_VERSION: ${{ github.event.client_payload.version || inputs.version }}
          STATIC_NOISE_BOOTSTRAP: ${{ github.event.client_payload.bootstrap && 'true' || 'false' }}
        run: |
          [[ "$STATIC_NOISE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          [[ "$STATIC_NOISE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-][0-9A-Za-z.-]+)?$ ]]
          source_path='dist/neovim/palette.lua'
          curl --fail --silent --show-error --location "https://raw.githubusercontent.com/hcastillaq/static-noise/$STATIC_NOISE_SHA/$source_path" -o lua/static-noise/palette.lua
          test -s lua/static-noise/palette.lua
          cat > UPSTREAM.md <<EOF
          # Static Noise upstream provenance

          - **Repository:** https://github.com/hcastillaq/static-noise
          - **Version:** $STATIC_NOISE_VERSION
          - **Commit SHA:** \`$STATIC_NOISE_SHA\`
          - **Source path:** \`$source_path\`

          \`lua/static-noise/palette.lua\` is generated by Static Noise. Do not edit it locally.
          EOF
          if [[ "$STATIC_NOISE_BOOTSTRAP" != 'true' ]]; then
            IFS=. read -r major minor patch <<< "$(tr -d '[:space:]' < VERSION)"
            printf '%s.%s.%s\n' "$major" "$minor" "$((patch + 1))" > VERSION
          fi
      - name: Validate Lua when Neovim is available
        run: |
          if command -v nvim >/dev/null; then
            nvim --headless --clean '+lua assert(loadfile("lua/static-noise/palette.lua"))' +qa
          fi
      - uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/sync-static-noise-${{ github.event.client_payload.version || inputs.version }}
          delete-branch: true
          commit-message: 'chore: sync Static Noise v${{ github.event.client_payload.version || inputs.version }}'
          title: 'chore: sync Static Noise v${{ github.event.client_payload.version || inputs.version }}'
          body: |
            Synchronizes the Neovim palette from the immutable Static Noise commit `${{ github.event.client_payload.sha || inputs.sha }}`.
