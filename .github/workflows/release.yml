name: Release Neovim theme

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag and plugin version match
        env:
          TAG: ${{ github.ref_name }}
        run: |
          test "v$(tr -d '[:space:]' < VERSION)" = "$TAG"
      - name: Install Neovim
        run: |
          sudo apt-get update
          sudo apt-get install --yes neovim
      - name: Load the colorscheme in a clean Neovim instance
        run: |
          nvim --headless --clean --cmd "set rtp+=$PWD" '+colorscheme static-noise' '+lua assert(vim.g.colors_name == "static-noise")' +qa
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
